name: node-verify

# Shared Node verify loop: install → typecheck → test → build.
# Callers pass package.json script names; an empty name skips that gate, so a
# repo without tests advertises that fact instead of faking a green suite.
#
# Usage:
#   jobs:
#     verify:
#       uses: mark-mcdermott/mm-claude-starter/.github/workflows/node-verify.yml@main
#       with:
#         node-version: "25"

on:
  workflow_call:
    inputs:
      node-version:
        description: Node major to run on. Pin it — an unpinned toolchain rots CI with no commit to blame.
        type: string
        default: "24"
      package-manager:
        description: pnpm or npm. pnpm reads its own version from packageManager in package.json.
        type: string
        default: pnpm
      lint-script:
        description: Script that lints. Empty skips the gate — not every repo has one.
        type: string
        default: ""
      typecheck-script:
        description: Script that typechecks. Empty skips the gate.
        type: string
        default: check
      test-script:
        description: Script that runs the suite. Empty skips the gate.
        type: string
        default: test
      build-script:
        description: Script that builds. Empty skips the gate.
        type: string
        default: build
      runs-on:
        type: string
        default: ubuntu-latest

jobs:
  verify:
    runs-on: ${{ inputs.runs-on }}

    steps:
      - uses: actions/checkout@v7

      # Must precede setup-node, which needs pnpm on PATH to resolve its cache.
      # The version comes from packageManager, so it lives in one place.
      - if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      - name: Install
        env:
          PM: ${{ inputs.package-manager }}
        run: |
          if [ "$PM" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      # Separate steps so a red run names which gate failed. Script names reach
      # the shell through env, never string-interpolated into run:.
      - name: Lint
        if: inputs.lint-script != ''
        env:
          PM: ${{ inputs.package-manager }}
          SCRIPT: ${{ inputs.lint-script }}
        run: |
          "$PM" run "$SCRIPT"

      - name: Typecheck
        if: inputs.typecheck-script != ''
        env:
          PM: ${{ inputs.package-manager }}
          SCRIPT: ${{ inputs.typecheck-script }}
        run: |
          "$PM" run "$SCRIPT"

      - name: Test
        if: inputs.test-script != ''
        env:
          PM: ${{ inputs.package-manager }}
          SCRIPT: ${{ inputs.test-script }}
        run: |
          "$PM" run "$SCRIPT"

      - name: Build
        if: inputs.build-script != ''
        env:
          PM: ${{ inputs.package-manager }}
          SCRIPT: ${{ inputs.build-script }}
        run: |
          "$PM" run "$SCRIPT"
